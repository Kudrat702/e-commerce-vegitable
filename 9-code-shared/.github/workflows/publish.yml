name: Publish
on:
  push:
    branches: [master]  # Changed from "main" to "master"
  pull_request:
    branches: [master]  # Changed from "main" to "master"
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v3
        with:
          node-version: '22.14.0'
      - run: npm install
      - run: npm run build
      - run: |
          echo @Kudrat702:https://npm.pkg.github.com/ > build/.npmrc
          echo '//npm.pkg.github.com/:_authToken=${NPM_TOKEN}' >> build/.npmrc
      - run: npm publish
        working-directory: ./build
        env:
          NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}